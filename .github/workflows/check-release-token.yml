# Temporary: checks that the GH_TOKEN org secret used by version-bump.yml is
# valid and can push to this repository, without printing it. Remove before
# merging.
name: Check release token

on:
  pull_request:
    paths:
      - '.github/workflows/check-release-token.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: GH_TOKEN is valid and can push here
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is not available to this repository"
            exit 1
          fi
          code=$(curl -s -D headers.txt -o repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO")
          echo "HTTP $code"
          jq '{full_name, permissions}' repo.json || true
          echo "Token expiration: $(grep -i '^github-authentication-token-expiration:' headers.txt | cut -d' ' -f2- | tr -d '\r' || true)"
          test "$code" = 200
          test "$(jq -r '.permissions.push' repo.json)" = true
          echo "GH_TOKEN can push to $REPO"
